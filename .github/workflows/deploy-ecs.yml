name: Deploy to ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: root
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/question_repo/.git ]; then
              git clone https://github.com/dongb7856/question_repo.git /opt/question_repo
            fi
            cd /opt/question_repo
            git pull origin main || git pull origin master
            docker compose build
            docker compose up -d
            docker compose ps
